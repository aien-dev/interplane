name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  schemas-and-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12.14"}
      - run: pip install -c constraints/ci-python.txt jsonschema
      - name: schema self-check
        run: |
          python - <<'PY'
          import json,glob
          from jsonschema import Draft202012Validator
          for f in sorted(glob.glob('spec/schemas/*.json')):
              Draft202012Validator.check_schema(json.load(open(f))); print('ok', f)
          PY
      - name: fixture validation
        run: python conformance/runners/validate_fixtures.py
  bench-structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12.14"}
      - run: pip install -c constraints/ci-python.txt jsonschema
      - name: bench corpus structure, domain rule, coverage, digests (no model, no GPU)
        run: python bench/tools/validate.py --require-jsonschema
      - name: 0.2x held-out corpus structure, coverage, composition, digests (no model, no GPU)
        run: python bench/tools/validate.py --corpus 0.2x --require-jsonschema
      - name: gate M live-model runner offline test (scripted endpoint, mock runtime; no model, no GPU)
        run: PYTHONPATH=python PYTHONDONTWRITEBYTECODE=1 python bench/tools/test_live_injection.py
      - name: pre-registered statistics reproduce Newcombe 1998 Table III
        run: python bench/tools/stats.py
      - name: 0.2y leakage lint, authoring-log replay, composition checks and P analyzer (synthetic data; no model, no GPU)
        run: |
          python bench/tools/test_lint_02y.py
          python bench/tools/test_analyze_y.py
          python bench/tools/test_authoring_02y.py
          python bench/tools/test_assemble_02y.py
          python bench/tools/assemble_02y.py --check-slots
          PYTHONPATH=python python bench/tools/test_runner_corpus_y.py
      - name: analyzer tests and synthetic-run fixture (no model, no GPU)
        run: |
          python bench/tools/test_analyze.py
          python bench/tools/analyze.py bench/tools/testdata/synthetic-run --out /tmp/analyze-out
          diff -r /tmp/analyze-out bench/tools/testdata/synthetic-expected
  rust:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: rust}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # branch stable at pin time; version comes from toolchain:
        with: {toolchain: "1.99.0", components: "rustfmt, clippy"}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all
      - name: negative controls (test-only feature) detect their defects
        run: cargo test -p interplane-conformance --features negative-controls
      - name: conformance (rust)
        run: cargo run -q -p interplane-conformance -- ../conformance/fixtures --out ../rust-verdicts.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: rust-verdicts, path: rust-verdicts.json}
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12.14"}
      - run: pip install -c constraints/ci-python.txt pytest jsonschema pyflakes -e python
      - run: python -m pyflakes python/interplane python/tests
      - run: python -m pytest python/tests -q
      - name: conformance (python)
        run: python -m interplane.conformance conformance/fixtures --out py-verdicts.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: py-verdicts, path: py-verdicts.json}
  package:
    # Release check (plan 19.7 item 8): the packages build, install clean, and behave like the checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12.14"}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # branch stable at pin time; version comes from toolchain:
        with: {toolchain: "1.99.0", components: "rustfmt, clippy"}
      - name: build the python wheel
        run: pip wheel --no-deps -w dist ./python
      - name: install the wheel into a clean venv and run both examples from outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install dist/interplane-*.whl
          cd "$RUNNER_TEMP"
          INTERPLANE_REQUIRE_INSTALLED=1 "$RUNNER_TEMP/v/bin/python" "$GITHUB_WORKSPACE/examples/offline/run_offline.py"
          INTERPLANE_REQUIRE_INSTALLED=1 "$RUNNER_TEMP/v/bin/python" "$GITHUB_WORKSPACE/examples/adapter/todo_adapter.py"
      - name: conformance from the installed wheel equals conformance from the checkout
        run: |
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/v/bin/interplane-conformance" "$GITHUB_WORKSPACE/conformance/fixtures" --out "$RUNNER_TEMP/wheel-verdicts.json")
          PYTHONPATH=python python -m interplane.conformance "$GITHUB_WORKSPACE/conformance/fixtures" --out "$RUNNER_TEMP/checkout-verdicts.json"
          cmp "$RUNNER_TEMP/wheel-verdicts.json" "$RUNNER_TEMP/checkout-verdicts.json"
      - name: the shared adapter runner judges a recorded adapter against the installed wheel
        run: |
          H="$GITHUB_WORKSPACE/bench/runs/home-check-20261005T1320Z"
          mkdir "$RUNNER_TEMP/home" && cp "$H/authority.py" "$H/table-entry.json" "$RUNNER_TEMP/home/"
          printf 'from authority import RUNTIME, POLICY, make_pipeline, HomeAuthority\n\n\ndef make_authority(**kw):\n    return HomeAuthority(**kw)\n' > "$RUNNER_TEMP/home/shim.py"
          cd "$RUNNER_TEMP"
          R="$RUNNER_TEMP/v/bin/python $GITHUB_WORKSPACE/conformance/runners/adapter_runner.py --module home/shim.py --entry home/table-entry.json"
          $R --out home/verdicts.json && cmp home/verdicts.json "$H/verdicts.json"
          if $R --no-exposure-check --out home/negctl.json; then echo "negative control passed"; exit 1; fi
          cmp home/negctl.json "$H/verdicts-negctl.json"
      - name: package every Rust crate and build each from its .crate alone
        working-directory: rust
        run: cargo package --workspace --locked
  negative-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12.14"}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # branch stable at pin time; version comes from toolchain:
        with: {toolchain: "1.99.0", components: "rustfmt, clippy"}
      - run: pip install -c constraints/ci-python.txt -e python
      - name: trust corpus and protocol digests match conformance/TRUST-DIGEST.txt
        run: python conformance/runners/trust_digest.py --check
      - name: pipeline libraries never mention the negative controls
        run: |
          ! grep -rIl -E 'negctl|negative-controls|NEGCTL' rust/crates/interplane-core rust/crates/interplane-crossveil rust/crates/interplane-crossaxis rust/crates/interplane-lenshift python/interplane/core.py python/interplane/crossveil.py python/interplane/crossaxis.py python/interplane/lenshift
      - name: default build refuses a variant and carries no variant code
        working-directory: rust
        run: |
          cargo build -q -p interplane-conformance
          ! grep -q NEGCTL_BUILT_IN target/debug/interplane-conformance
          rc=0; target/debug/interplane-conformance ../conformance/fixtures --out /dev/null --variant V4 || rc=$?
          test "$rc" = 2
      - name: negative-control matrix, offline, both languages (every variant must be detected)
        run: |
          (cd rust && cargo run -q -p interplane-conformance --features negative-controls -- ../conformance/fixtures --matrix ../rust-matrix.json)
          python -m interplane.conformance conformance/fixtures --matrix py-matrix.json
          cmp rust-matrix.json py-matrix.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: negative-control-matrix, path: rust-matrix.json}
  cross-language:
    needs: [rust, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: rust-verdicts}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: py-verdicts}
      - name: verdicts must be identical
        run: |
          python3 - <<'PY'
          import json,sys
          r=json.load(open('rust-verdicts.json')); p=json.load(open('py-verdicts.json'))
          bad=[c for c in sorted(set(r)|set(p)) if json.dumps(r.get(c),sort_keys=True)!=json.dumps(p.get(c),sort_keys=True)]
          print('cases:',len(r),'mismatches:',bad); sys.exit(1 if bad or len(r)!=106 else 0)
          PY
  provenance:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: provenance}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # branch stable at pin time; version comes from toolchain:
        with: {toolchain: "1.99.0", components: "rustfmt, clippy"}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: fixture verdicts from the CLI
        run: |
          test "$(cargo run -q --locked -- verify fixtures/synthetic-full-chain)" = "PASS_LABELLED_INCOMPLETE missing=link:model_turn effect=aien-ledger-slice/1:strong proposal=scripted_turn"
          test "$(cargo run -q --locked -- verify fixtures/synthetic-weak-receipt)" = "PASS_LABELLED_INCOMPLETE missing=link:model_turn effect=record_effect_receipt/1:weak"
          test "$(cargo run -q --locked -- verify fixtures/real-waldo-aien-chain)" = "PASS complete effect=aien-ledger-slice/1:strong proposal=model_generation/2 candidate=none"
          test "$(cargo run -q --locked -- verify fixtures/real-waldo-tokenizer-json)" = "PASS_LABELLED_INCOMPLETE missing=link:effect,link:interplane"
          test "$(cargo run -q --locked -- verify fixtures/real-waldo-smoke)" = "PASS_LABELLED_INCOMPLETE missing=link:aien,link:effect,link:interplane"
  adapter-aien:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: interplane}
      - name: pinned AIEN sibling checkouts from adapters/aien/PINS (aegis-runtime reaches ../aien-protocols by path)
        run: |
          interplane/adapters/aien/setup-siblings.sh "$PWD"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # branch stable at pin time; version comes from toolchain:
        with: {toolchain: "1.99.0", components: "rustfmt, clippy"}
      - run: cargo fmt --all --check
        working-directory: interplane/adapters/aien
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: interplane/adapters/aien
      - run: cargo test
        working-directory: interplane/adapters/aien
      - name: T4 subset through the real Pipeline and AIEN authority (bench/PROTOCOL-0.3.md section 2; no skips)
        run: T4_OUT=$RUNNER_TEMP/t4-verdicts.json cargo test --test t4_corpus -- --nocapture
        working-directory: interplane/adapters/aien
  adapter-odysseus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12.14"}
      - name: pinned Odysseus checkout (odysseus-dev/odysseus @ 2992bf6)
        run: |
          git clone -q https://github.com/odysseus-dev/odysseus.git ../odysseus
          git -C ../odysseus checkout -q 2992bf6
          pip install -q -c $GITHUB_WORKSPACE/constraints/ci-python.txt -r ../odysseus/requirements.txt pytest pyflakes
      - run: python -m pyflakes adapters/odysseus
      - name: adapter tests against the real Odysseus code (no skips allowed)
        run: |
          cd adapters/odysseus
          ODYSSEUS_SRC=$GITHUB_WORKSPACE/../odysseus PYTHONPATH=$GITHUB_WORKSPACE/python:. PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest tests -q -p no:cacheprovider -rs | tee pytest.log
          ! grep -q "skipped" pytest.log
      - name: T3 subset through the real Pipeline and Odysseus authority (bench/PROTOCOL-0.3.md section 2; no skips)
        run: |
          ODYSSEUS_SRC=$GITHUB_WORKSPACE/../odysseus PYTHONPATH=$GITHUB_WORKSPACE/python:adapters/odysseus PYTHONDONTWRITEBYTECODE=1 \
            python -m interplane_adapter_odysseus.t3 --out $RUNNER_TEMP/t3-verdicts.json
      - name: bench runner offline test (scripted endpoint, sim-1 backends, runtime-v1 with denial/approval negative controls)
        run: ODYSSEUS_SRC=$GITHUB_WORKSPACE/../odysseus PYTHONDONTWRITEBYTECODE=1 python bench/tools/test_runner_offline.py
