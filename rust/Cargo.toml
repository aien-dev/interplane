[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/aien-dev/interplane"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
thiserror = "2"
jsonschema = "0.30"
ureq = { version = "2", features = ["json"] }
interplane-core = { path = "crates/interplane-core" }
interplane-lenshift = { path = "crates/interplane-lenshift" }
interplane-crossaxis = { path = "crates/interplane-crossaxis" }
interplane-crossveil = { path = "crates/interplane-crossveil" }
