name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  no-python:
    # Project rule (Drake, 2026-10-15): no Python ships in this repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: no Python file is tracked
        run: |
          found=$(git ls-files -- ':(glob)**/*.py' ':(glob)**/*.pyi' ':(glob)**/*.pyx' ':(glob)**/*.ipynb' \
            ':(glob)**/pyproject.toml' ':(glob)**/requirements*.txt' ':(glob)**/setup.py' ':(glob)**/setup.cfg' \
            ':(glob)**/Pipfile' ':(glob)**/Pipfile.lock')
          # Scripts without a .py ending: a first line that runs Python.
          shebang=$(git ls-files -z | xargs -0 -r awk 'FNR == 1 { if ($0 ~ /^#!.*python/) print FILENAME; nextfile }')
          found=$(printf '%s\n%s\n' "$found" "$shebang" | sed '/^$/d')
          if [ -n "$found" ]; then
            printf 'Python files are tracked; this repository ships no Python:\n%s\n' "$found"
            exit 1
          fi
  schemas-and-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # branch stable at pin time; version comes from toolchain:
        with: {toolchain: "1.99.0"}
      - name: schema self-check
        working-directory: rust
        run: cargo run -q --locked -p interplane-conformance --bin interplane-corpus -- schemas
      - name: fixture validation
        working-directory: rust
        run: cargo run -q --locked -p interplane-conformance --bin interplane-corpus -- validate
  rust:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: rust}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # branch stable at pin time; version comes from toolchain:
        with: {toolchain: "1.99.0", components: "rustfmt, clippy"}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all
      - name: negative controls (test-only feature) detect their defects
        run: cargo test -p interplane-conformance --features negative-controls
      - name: both examples run offline and check their own story (exit 1 on any difference)
        run: |
          cargo run -q -p interplane-crossveil --example offline
          cargo run -q -p interplane-crossveil --example todo_adapter
      - name: conformance verdicts equal the recorded reference (106 cases; the retired Python SDK gave the same bytes)
        run: |
          cargo run -q --locked -p interplane-conformance --bin interplane-conformance -- ../conformance/fixtures --out ../rust-verdicts.json
          cmp ../rust-verdicts.json ../conformance/expected/verdicts.json
          test "$(jq length ../rust-verdicts.json)" = 106
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: rust-verdicts, path: rust-verdicts.json}
  package:
    # Release check (plan 19.7 item 8): every crate packages and builds from its .crate alone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # branch stable at pin time; version comes from toolchain:
        with: {toolchain: "1.99.0", components: "rustfmt, clippy"}
      - name: package every Rust crate and build each from its .crate alone
        working-directory: rust
        run: cargo package --workspace --locked
  negative-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # branch stable at pin time; version comes from toolchain:
        with: {toolchain: "1.99.0", components: "rustfmt, clippy"}
      - name: trust corpus and protocol digests match conformance/TRUST-DIGEST.txt
        working-directory: rust
        run: cargo run -q --locked -p interplane-conformance --bin interplane-corpus -- trust-digest --check
      - name: pipeline libraries never mention the negative controls
        run: |
          ! grep -rIl -E 'negctl|negative-controls|NEGCTL' rust/crates/interplane-core rust/crates/interplane-crossveil rust/crates/interplane-crossaxis rust/crates/interplane-lenshift
      - name: default build refuses a variant and carries no variant code
        working-directory: rust
        run: |
          cargo build -q -p interplane-conformance
          ! grep -q NEGCTL_BUILT_IN target/debug/interplane-conformance
          rc=0; target/debug/interplane-conformance ../conformance/fixtures --out /dev/null --variant V4 || rc=$?
          test "$rc" = 2
      - name: negative-control matrix, offline, equals the recorded reference (every variant must be detected)
        run: |
          (cd rust && cargo run -q -p interplane-conformance --bin interplane-conformance --features negative-controls -- ../conformance/fixtures --matrix ../rust-matrix.json)
          cmp rust-matrix.json conformance/expected/negative-control-matrix.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: negative-control-matrix, path: rust-matrix.json}
  provenance:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: provenance}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # branch stable at pin time; version comes from toolchain:
        with: {toolchain: "1.99.0", components: "rustfmt, clippy"}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: fixture verdicts from the CLI
        run: |
          test "$(cargo run -q --locked -- verify fixtures/synthetic-full-chain)" = "PASS_LABELLED_INCOMPLETE missing=link:model_turn effect=aien-ledger-slice/1:strong proposal=scripted_turn"
          test "$(cargo run -q --locked -- verify fixtures/synthetic-fix-the-test)" = "PASS_LABELLED_INCOMPLETE missing=link:model_turn effect=aien-ledger-slice/1:strong proposal=scripted_turn"
          test "$(cargo run -q --locked -- verify fixtures/synthetic-weak-receipt)" = "PASS_LABELLED_INCOMPLETE missing=link:model_turn effect=record_effect_receipt/1:weak"
          test "$(cargo run -q --locked -- verify fixtures/real-waldo-aien-chain)" = "PASS complete effect=aien-ledger-slice/1:strong proposal=model_generation/2 candidate=none"
          test "$(cargo run -q --locked -- verify fixtures/real-waldo-tokenizer-json)" = "PASS_LABELLED_INCOMPLETE missing=link:effect,link:interplane"
          test "$(cargo run -q --locked -- verify fixtures/real-waldo-smoke)" = "PASS_LABELLED_INCOMPLETE missing=link:aien,link:effect,link:interplane"
  adapter-aien:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: interplane}
      - name: pinned AIEN sibling checkouts from adapters/aien/PINS (aegis-runtime reaches ../aien-protocols by path)
        run: |
          interplane/adapters/aien/setup-siblings.sh "$PWD"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # branch stable at pin time; version comes from toolchain:
        with: {toolchain: "1.99.0", components: "rustfmt, clippy"}
      - run: cargo fmt --all --check
        working-directory: interplane/adapters/aien
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: interplane/adapters/aien
      - run: cargo test
        working-directory: interplane/adapters/aien
      - name: T4 subset through the real Pipeline and AIEN authority (bench/PROTOCOL-0.3.md section 2; no skips)
        run: T4_OUT=$RUNNER_TEMP/t4-verdicts.json cargo test --test t4_corpus -- --nocapture
        working-directory: interplane/adapters/aien
